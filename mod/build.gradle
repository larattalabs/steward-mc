plugins {
	// Minecraft 26.x is unobfuscated: the non-remapping Loom plugin (no mappings, no remapJar), as in Architect.
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenCentral()
	// Architect's public API and mod (dev.larattalabs:architect_mc) come from GitHub Packages, the released artifact, which needs a token even for
	// public packages (GITHUB_TOKEN with packages: read in Actions, a PAT with read:packages elsewhere); once fetched, Gradle's cache serves --offline.
	// A local Architect jar is ARCHITECT_JAR (below).
	mavenLocal {
		// never Architect or lab-ui from here: a local publish may come from a checkout past its release tag (an Architect slice keeps main's
		// mod_version, so it would shadow the release under its coordinates; settings.gradle picks lab-ui's tagged checkout or the release)
		content {
			excludeModule 'dev.larattalabs', 'architect_mc'
			excludeModule 'dev.larattalabs', 'lab_ui'
		}
	}
	// lab-ui, the shared UI library (dev.larattalabs:lab_ui): a clean checkout at its release tag (settings.gradle), else the release from GitHub Packages
	// with the same token
	maven {
		url = uri('https://maven.pkg.github.com/larattalabs/lab-ui')
		credentials {
			username = providers.gradleProperty('gpr.user').orElse(providers.environmentVariable('GITHUB_ACTOR')).getOrElse('')
			password = providers.gradleProperty('gpr.key').orElse(providers.environmentVariable('GITHUB_TOKEN')).getOrElse('')
		}
		content { includeGroup 'dev.larattalabs' }
	}
	maven {
		url = uri('https://maven.pkg.github.com/larattalabs/architect-mc')
		credentials {
			username = System.getenv('GITHUB_ACTOR')
			password = System.getenv('GITHUB_TOKEN')
		}
		content { includeGroup 'dev.larattalabs' }
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"steward_mc" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	runs {
		client {
			def player = (System.getenv("STEWARD_PLAYER") ?: System.getProperty("user.name") ?: "Player").replaceAll(/[^A-Za-z0-9_]/, "").take(16) ?: "Player"
			programArgs "--username", player, "--width", "1920", "--height", "1080"
			vmArgs "-Xmx4G", "--enable-native-access=ALL-UNNAMED"
			// Port allocation agreed with the Architect session so dev clients never collide: Steward uses 8490 (sidecar) / 8491 (DevBridge),
			// 8590+ if more are needed. Override with STEWARD_PORT / STEWARD_DEV_PORT.
			environmentVariable "ARCHITECT_PORT", System.getenv("STEWARD_PORT") ?: "8490"
			environmentVariable "ARCHITECT_DEV_PORT", System.getenv("STEWARD_DEV_PORT") ?: "8491"
			runDir "run"
		}
		server {
			runDir "run/server"
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Architect's public API and mod (dev.larattalabs.architect.api): the release from GitHub Packages, never mavenLocal (above). Pin the exact
	// version: Architect's API is semver'd from 1.0.0 but the artifact is 0.x. A pin moves architect_version here, fabric.mod.json's architect_mc
	// range (the lower end; the upper end stays below the next major API), and with it ArchitectGateway's runtime minimum.
	// ARCHITECT_JAR (or -Parchitect.jar): a local Architect jar instead, for a release candidate Architect asks Steward to check (dev and e2e only, never
	// a release: the build says so)
	def architectJar = providers.gradleProperty('architect.jar').orElse(providers.environmentVariable('ARCHITECT_JAR')).getOrNull()
	if (architectJar) {
		logger.warn("UNRELEASED: Architect from ${architectJar}, not ${project.architect_version}")
		implementation files(architectJar)
	} else {
		implementation "dev.larattalabs:architect_mc:${project.architect_version}"
	}
	// lab-ui: the screen kit, world UI and crash guard shared with Architect and AgentCraft; bundled jar-in-jar
	implementation "dev.larattalabs:lab_ui:${project.lab_ui_version}"
	include "dev.larattalabs:lab_ui:${project.lab_ui_version}"

	testImplementation platform("org.junit:junit-bom:${project.junit_version}")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
	useJUnitPlatform()
	testLogging {
		events "failed"
		exceptionFormat "full"
	}
}

processResources {
	def version = project.version
	inputs.property "version", version
	// plan-0.json is only the Node tools' copy of the jar's schema; the mod reads Regions.planSchema()
	from('../schema') { into 'steward/schema'; exclude 'plan-0.json' }
	from('../prompts') { into 'steward/prompts' }
	// the live module catalog (docs/MODULES.md, slice M1): programs are copied byte for byte (no filtering), their sha256 is their identity
	from('../modules') { into 'steward/modules' }
	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

// Test fixtures shared with the schema tests (../fixtures: prompt + expected concept card).
sourceSets.test.resources.srcDir '../fixtures'

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = "UTF-8"
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

// A lab-ui checkout built with this one (settings.gradle): compile against its jar, as Architect and AgentCraft do. The classes variant Gradle picks
// otherwise is lab-ui's main classes directory only, without its client source set.
if (gradle.ext.has("labUiDir")) {
	afterEvaluate {
		configurations.matching { it.name.endsWith("ompileClasspath") }.configureEach {
			attributes.attribute(LibraryElements.LIBRARY_ELEMENTS_ATTRIBUTE, objects.named(LibraryElements, LibraryElements.JAR))
		}
	}
}
