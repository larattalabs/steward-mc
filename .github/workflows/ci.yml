name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: read   # Architect's API artifact is on GitHub Packages (dev.larattalabs:architect_mc)

jobs:
  schema:
    name: Concept card schema and fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  mod:
    name: Mod build and tests
    runs-on: ubuntu-latest
    env:
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        working-directory: mod
        run: ./gradlew build --no-daemon
